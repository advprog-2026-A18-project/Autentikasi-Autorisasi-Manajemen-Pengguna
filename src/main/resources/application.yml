server:
  port: 8081

grpc:
  server:
    enabled: ${GRPC_SERVER_ENABLED:true}
    port: ${GRPC_PORT:9091}

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 600000
  refreshExpirationMs: 604800000

spring:
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]

app:
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    fullname: ${ADMIN_FULLNAME}
  google:
    clientId: ${GOOGLE_CLIENT_ID}
  profiling-seeder:
    enabled: false
    mandor-count: 20
    buruh-count: 200
    supir-count: 50
    google-user-count: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
